<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal das pastorais</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dobylucky78-droid/secretaria-miguelangelus/main/secretaria/marca/icone-256.png">
<style>
  /* identidade da Secretaria MiguelAngelus: escuro com dourado (claro quando o celular está no modo claro) */
  :root { --fundo:#121418; --cartao:#1b1e24; --campo:#0e1013; --texto:#e7e9ec; --sutil:#98a1ab; --linha:#2f343d; --cor:#d4a93a; --cor2:#f0c75e; --cor-txt:#1a1300;
    --ok:#57b36f; --aviso:#2e2716; --aviso-borda:#8a7330; --mudado:#2c2615; --topo:#1b1e24; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --fundo:#f5f3ee; --cartao:#fff; --campo:#fbfaf7; --texto:#22252b; --sutil:#646b75; --linha:#e0dcd2; --cor:#b8860b; --cor2:#d4a93a; --cor-txt:#fff;
      --ok:#2e7d4f; --aviso:#fff4d6; --aviso-borda:#e7c76b; --mudado:#fdf6e3; --topo:#1b1e24; color-scheme: light; }
  }  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--topo); color: #e7e9ec; border-bottom: 3px solid #d4a93a; }
  header .dentro { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 46px; height: 46px; flex: none; border-radius: 11px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  header .tit { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 1.12rem; line-height: 1.2; font-weight: 700; white-space: nowrap; }
  header h1 .dourado { color: #ffd95a; }
  .marca-sec { position: relative; display: inline-block; font-style: italic; font-weight: 900; color: #ffcf33; padding: 0 .12em; margin-left: 2px; z-index: 0; }
  .marca-sec::after { content: ""; position: absolute; left: .02em; right: .04em; bottom: .04em; height: .26em; z-index: -1; border-radius: .12em;
    background: linear-gradient(90deg, rgba(245,158,11,.75), rgba(255,207,51,.35)); transform: skewX(-18deg); }
  header .sub { margin: 2px 0 0; font-size: .86rem; color: #c3c9d0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sub b { color: #e7e9ec; font-weight: 600; }
  header .brasao { height: 52px; max-width: 110px; object-fit: contain; flex: none; }
  @media (max-width: 380px) { header h1 { font-size: 1rem; } header .logo { width: 40px; height: 40px; } header .brasao { height: 44px; } }
  @media (max-width: 520px) { header #hLogo2 { display: none; } }
  body:has(.capa-par) header .brasao { display: none; }    /* a capa já mostra o brasão e o logo, grandes */
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  label { display: block; margin: 0 0 12px; font-size: .92rem; color: var(--sutil); }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--texto); background: var(--campo);
    border: 1px solid var(--linha); border-radius: 8px; padding: 10px; }
  textarea { min-height: 8em; resize: vertical; }
  .chk { display: flex; gap: 8px; align-items: flex-start; color: var(--texto); }
  .chk > input { margin-top: 4px; width: auto; display: inline-block; flex: none; }
  .chk > span { flex: 1; }
  button { font: inherit; border: 1px solid var(--linha); background: var(--cartao); color: var(--texto); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  button.primario { background: var(--cor); border-color: var(--cor); color: var(--cor-txt); font-weight: 700; }
  button:disabled { opacity: .55; cursor: default; }
  .link { background: none; border: none; color: var(--cor); padding: 6px 0; text-decoration: underline; }
  .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .linha > label { flex: 1 1 180px; }
  .espaco { flex: 1; }
  .sutil { color: var(--sutil); }
  .pequeno { font-size: .85rem; }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; background: var(--aviso); border: 1px solid var(--aviso-borda); }
  .msg.ok { background: transparent; border-color: var(--ok); color: var(--ok); }
  .lgpd { font-size: .85rem; color: var(--sutil); border-left: 3px solid var(--linha); padding-left: 10px; margin: 0 0 12px; }
  .missa { border-top: 1px solid var(--linha); padding: 10px 0; }
  .missa:first-child { border-top: 0; }
  .missa .quando { font-weight: 600; }
  .missa .onde { color: var(--sutil); font-size: .9rem; }
  .missa input { width: 100%; margin-top: 6px; font: inherit; color: var(--texto); background: var(--campo); border: 1px solid var(--linha); border-radius: 8px; padding: 9px; }
  .missa.mudada input { background: var(--mudado); border-color: var(--cor2); }
  .missa .estado { font-size: .8rem; margin-top: 4px; color: var(--sutil); }
  .missa .estado b { color: var(--cor); }
  .rodape { position: sticky; bottom: 0; background: var(--fundo); padding: 10px 0; border-top: 1px solid var(--linha); display: flex; gap: 10px; align-items: center; }
  .abas { display: flex; gap: 6px; margin: 0 0 12px; }
  .abas button.ativo { background: var(--cor); border-color: var(--cor); color: var(--cor-txt); }
  .oculto { display: none !important; }
  /* (0.2.0) agenda pastoral */
  .secoes { margin: 0 0 14px; flex-wrap: wrap; }
  .ag-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .ag-cab button { padding: 6px 10px; }
  .ag-cab .abas { margin: 0; }
  .ag-mes { font-size: 1.08rem; min-width: 9.5em; text-align: center; }
  .ag-mes::first-letter { text-transform: uppercase; }
  select.campo { font: inherit; color: var(--texto); background: var(--campo); border: 1px solid var(--linha); border-radius: 8px; padding: 8px; max-width: 100%; }
  .ag-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin: 12px 0; }
  .ag-dsem { text-align: center; font-size: .75rem; color: var(--sutil); }
  .ag-dia { background: var(--campo); border: 1px solid var(--linha); border-radius: 6px; min-height: 86px; padding: 3px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  main:has(.ag-grade) { max-width: 1080px; }
  .ag-dia.pode { cursor: pointer; }
  .ag-dia.fora { opacity: .3; }
  .ag-dia.hoje { border-color: var(--cor); }
  .ag-num { font-size: .78rem; color: var(--sutil); }
  .ag-dia.hoje .ag-num { color: var(--cor); font-weight: 700; }
  .ag-ev { display: block; width: 100%; text-align: left; font-size: .7rem; line-height: 1.25; padding: 2px 4px; border: 0; border-left: 3px solid var(--c);
    background: color-mix(in srgb, var(--c) 24%, transparent); color: var(--texto); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-ev.prov, .ag-lev.prov { border-left-style: dashed; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 18%, transparent) 0 6px, transparent 6px 10px); }
  .ag-ev.recus, .ag-lev.recus { opacity: .55; text-decoration: line-through; }
  .ag-situ { border: 1px dashed var(--linha); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; font-size: .9rem; }
  .ag-mais { font-size: .72rem; padding: 0 4px; border: 0; background: none; color: var(--cor); text-align: left; }
  .ag-conf { font-size: .78rem; cursor: help; }
  .ag-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--sutil); margin-top: 8px; }
  .ag-legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  .ag-ldia { border-top: 1px solid var(--linha); padding: 8px 0; }
  .ag-ldata { font-weight: 600; margin-bottom: 4px; }
  .ag-ldia.hoje .ag-ldata { color: var(--cor); }
  .ag-lev { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px; border: 1px solid var(--linha); border-left: 5px solid var(--c); background: var(--cartao); }
  .ag-det p { margin: 0 0 8px; }
  .ag-aviso { font-size: .88rem; }
  a.botao { display: inline-block; border: 1px solid var(--linha); background: var(--cartao); color: var(--texto); border-radius: 8px; padding: 10px 14px; text-decoration: none; }
  .rel-hist { font-size: .85rem; color: var(--sutil); border-top: 1px solid var(--linha); margin-top: 12px; padding-top: 8px; }
  @media (max-width: 560px) { .ag-dia { min-height: 54px; } .ag-ev { font-size: 0; height: 7px; padding: 0; margin-top: 1px; } .ag-mes { min-width: 0; } }
  .capa-par { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 4px 0 14px; text-align: center; }
  .capa-logos { display: flex; align-items: center; justify-content: center; gap: 22px; background: #1b1e24; border-radius: 14px; padding: 12px 22px; max-width: 100%; }
  .capa-logos img { height: 96px; max-width: 45vw; object-fit: contain; }
  .capa-par b { font-size: 1.05rem; }
  .ag-aberta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  .carregando { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<header><div class="dentro"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="logo" aria-hidden="true"><defs><linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#f0a000"/></linearGradient><radialGradient id="brilho" cx="0.5" cy="0.36" r="0.5"><stop offset="0" stop-color="#fffbe6" stop-opacity=".75"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient><linearGradient id="asa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fde9e2"/></linearGradient><linearGradient id="capa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0473a"/><stop offset="1" stop-color="#a82a20"/></linearGradient><linearGradient id="tunica" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f95ec"/><stop offset="1" stop-color="#2d6cc4"/></linearGradient><clipPath id="moldura"><rect width="512" height="512" rx="112"/></clipPath></defs><g clip-path="url(#moldura)"><rect width="512" height="512" fill="url(#fundo)"/><circle cx="256" cy="200" r="240" fill="url(#brilho)"/><g stroke="#fff3b0" stroke-width="10" stroke-linecap="round" opacity=".55" fill="none"><path d="M70 120 l40 26"/><path d="M48 196 l46 8"/><path d="M442 120 l-40 26"/><path d="M464 196 l-46 8"/></g><g stroke="#d9a7a0" stroke-width="5" stroke-linejoin="round" fill="url(#asa)"><path d="M206 262 C150 214 92 212 52 250 C66 258 76 268 80 280 C62 290 54 304 54 320 C78 312 96 314 108 324 C98 340 98 356 104 370 C128 350 150 340 176 338 C188 316 200 292 212 276 Z"/><path d="M306 262 C362 214 420 212 460 250 C446 258 436 268 432 280 C450 290 458 304 458 320 C434 312 416 314 404 324 C414 340 414 356 408 370 C384 350 362 340 336 338 C324 316 312 292 300 276 Z"/></g><g stroke="#d9a7a0" stroke-width="4" stroke-linecap="round" fill="none"><path d="M90 262 C124 266 156 280 186 300"/><path d="M92 306 C124 306 152 316 180 328"/><path d="M422 262 C388 266 356 280 326 300"/><path d="M420 306 C388 306 360 316 332 328"/></g><path d="M188 250 L128 530 L384 530 L324 250 Z" fill="url(#capa)"/><path d="M200 252 Q256 232 312 252 L352 530 L160 530 Z" fill="url(#tunica)"/><path d="M226 246 Q256 272 286 246" fill="none" stroke="#ffd95a" stroke-width="7" stroke-linecap="round"/><rect x="178" y="438" width="156" height="18" rx="6" fill="#f2b632"/><path d="M204 262 C176 292 168 336 186 368" fill="none" stroke="#2d6cc4" stroke-width="30" stroke-linecap="round"/><path d="M308 262 C336 292 344 336 326 368" fill="none" stroke="#2d6cc4" stroke-width="30" stroke-linecap="round"/><g transform="rotate(-5 256 350)"><rect x="180" y="290" width="152" height="132" rx="14" fill="#7a3b12"/><rect x="186" y="296" width="140" height="120" rx="10" fill="#ffffff"/><path d="M186 306 a10 10 0 0 1 10 -10 h120 a10 10 0 0 1 10 10 v24 h-140 z" fill="#c8102e"/><g fill="#7a3b12"><rect x="210" y="282" width="10" height="26" rx="5"/><rect x="292" y="282" width="10" height="26" rx="5"/></g><g fill="#c9d6ea"><rect x="198" y="342" width="22" height="16" rx="3"/><rect x="226" y="342" width="22" height="16" rx="3"/><rect x="254" y="342" width="22" height="16" rx="3"/><rect x="282" y="342" width="22" height="16" rx="3"/><rect x="198" y="364" width="22" height="16" rx="3"/><rect x="226" y="364" width="22" height="16" rx="3"/><rect x="282" y="364" width="22" height="16" rx="3"/><rect x="198" y="386" width="22" height="16" rx="3"/><rect x="226" y="386" width="22" height="16" rx="3"/><rect x="254" y="386" width="22" height="16" rx="3"/></g><rect x="254" y="364" width="22" height="16" rx="3" fill="#f0a000"/><path d="M259 372 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="186" cy="372" r="16" fill="#f6c9a0"/><circle cx="326" cy="364" r="16" fill="#f6c9a0"/><rect x="240" y="226" width="32" height="28" rx="10" fill="#e9b88c"/><circle cx="256" cy="186" r="60" fill="#f6c9a0"/><circle cx="197" cy="194" r="11" fill="#f0bd92"/><circle cx="315" cy="194" r="11" fill="#f0bd92"/><path d="M196 188 C188 146 214 118 256 118 C298 118 324 146 316 188 C308 172 298 162 286 158 C280 170 262 172 250 162 C240 172 222 172 214 160 C204 166 198 176 196 188 Z" fill="#8a5a2b"/><g fill="#8a5a2b"><circle cx="206" cy="150" r="16"/><circle cx="230" cy="130" r="18"/><circle cx="258" cy="122" r="18"/><circle cx="286" cy="130" r="18"/><circle cx="306" cy="150" r="16"/></g><ellipse cx="234" cy="194" rx="8" ry="10" fill="#2b1d16"/><ellipse cx="278" cy="194" rx="8" ry="10" fill="#2b1d16"/><circle cx="237" cy="190" r="3" fill="#fff"/><circle cx="281" cy="190" r="3" fill="#fff"/><circle cx="218" cy="214" r="10" fill="#f28b8b" opacity=".45"/><circle cx="294" cy="214" r="10" fill="#f28b8b" opacity=".45"/><path d="M238 220 Q256 238 274 220" fill="none" stroke="#7a3b2e" stroke-width="5" stroke-linecap="round"/><ellipse cx="256" cy="96" rx="66" ry="17" fill="none" stroke="#a86b00" stroke-width="16"/><ellipse cx="256" cy="96" rx="66" ry="17" fill="none" stroke="#fff3b8" stroke-width="9"/><circle cx="420" cy="420" r="52" fill="#ffffff"/><circle cx="420" cy="420" r="44" fill="#1f4f8f"/><g fill="#ffffff"><path d="M394 408 h12 l30 -18 v60 l-30 -18 h-12 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6 z"/><path d="M402 434 h12 l6 22 h-12 z"/></g><g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"><path d="M446 406 q8 14 0 28"/></g></g></svg>
  <div class="tit"><h1><span class="dourado">Miguel</span>Angelus <span class="marca-sec">Secretaria</span></h1>
    <p class="sub">Portal das pastorais<span id="hParoquia"></span></p></div>
  <img id="hLogo2" class="brasao" alt="" hidden><img id="hBrasao" class="brasao" alt="" hidden></div></header>
<main id="raiz">
  <p class="sutil">Carregando…</p>
</main>

<script>
'use strict';
// ------------------------------------------------------------ conversa com o Apps Script
function chamar(acao, dados) {
  return new Promise((ok, falha) => google.script.run
    .withSuccessHandler(r => r && r.ok ? ok(r) : falha(r || { erro: 'Sem resposta.' }))
    .withFailureHandler(e => falha({ erro: 'Sem conexão com o portal. Tente de novo.' }))
    .api(acao, dados || {}));
}
const guardar = {
  ler(k) { try { return localStorage.getItem('portal.' + k) || ''; } catch (_) { return ''; } },
  por(k, v) { try { v ? localStorage.setItem('portal.' + k, v) : localStorage.removeItem('portal.' + k); } catch (_) {} },
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dataCurta = iso => { const [a, m, d] = iso.split('-').map(Number), dt = new Date(a, m - 1, d); return `${DIAS[dt.getDay()]} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`; };
const nomeMes = mes => { const [a, m] = mes.split('-').map(Number); return `${MESES[m - 1]} de ${a}`; };
const quando = iso => { try { const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return iso; } };

const S = { token: guardar.ler('token'), info: null, eu: null, meses: [], mes: '', funcao: '', escala: null, aba: 'escala', mudancas: {},
  // (0.2.0) agenda pastoral
  secao: guardar.ler('secao') || 'agenda', ag: null, agMes: '', agVista: guardar.ler('agVista') || (window.innerWidth < 640 ? 'lista' : 'cal'), agFiltro: '' };

// brasão grande da paróquia (entrada e agenda aberta)
const capaParoquia = () => S.brasao || S.logo2 || (S.info && S.info.paroquia)
  ? `<div class="capa-par">${S.brasao || S.logo2 ? `<div class="capa-logos">${S.brasao ? `<img src="${S.brasao}" alt="Brasão da paróquia">` : ''}${S.logo2 ? `<img src="${S.logo2}" alt="Pascom">` : ''}</div>` : ''}${S.info && S.info.paroquia ? `<b>${esc(S.info.paroquia)}</b>` : ''}</div>` : '';
const imgOk = s => !!s && /^data:image\/(png|jpeg|webp);base64,/.test(s);
function mostrarParoquia(nome, brasao, logo2) {
  if (imgOk(brasao)) S.brasao = brasao;
  if (imgOk(logo2)) { S.logo2 = logo2; $('#hLogo2').src = logo2; $('#hLogo2').hidden = false; }
  if (nome) { $('#hParoquia').innerHTML = ' · <b>' + esc(nome) + '</b>'; document.title = 'Portal das pastorais · ' + nome; }
  if (brasao && /^data:image\/(png|jpeg|webp);base64,/.test(brasao)) { $('#hBrasao').src = brasao; $('#hBrasao').hidden = false; }
}
function msg(texto, ok) { return texto ? `<p class="msg${ok ? ' ok' : ''}">${esc(texto)}</p>` : ''; }
function ocupado(sim) { $('#raiz').classList.toggle('carregando', !!sim); }
function erroDe(e) { if (e && e.sair) { S.token = ''; guardar.por('token', ''); } return (e && e.erro) || 'Não deu certo.'; }

// ------------------------------------------------------------ telas sem login
function telaEntrar(aviso, ok) {
  S.publico = false;
  $('#raiz').innerHTML = capaParoquia()
    + (S.info && S.info.agendaAberta ? `<div class="cartao ag-aberta"><div><b>📅 Calendário pastoral</b><br><span class="pequeno sutil">Veja os eventos da paróquia e das pastorais, sem precisar entrar.</span></div>
      <button type="button" class="primario" id="bVerAgenda">Ver o calendário</button></div>` : '')
    + `<div class="cartao">
    <h2>Entrar <span class="pequeno sutil" style="font-weight:400">(coordenadores e secretaria)</span></h2>${msg(aviso, ok)}
    <form id="fEntrar">
      <label>E-mail <input name="email" type="email" autocomplete="username" required value="${esc(guardar.ler('email'))}"></label>
      <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
      <div class="linha"><button class="primario">Entrar</button><span class="espaco"></span>
        <button type="button" class="link" id="bPedir">Pedir acesso</button></div>
      <p class="pequeno sutil">Esqueceu a senha? Peça à secretaria da paróquia para criar uma senha provisória.</p>
    </form></div>`;
  $('#bPedir').onclick = () => telaCadastro();
  if ($('#bVerAgenda')) $('#bVerAgenda').onclick = () => verAgendaAberta();
  $('#fEntrar').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, email = f.email.value.trim();
    ocupado(true);
    try {
      const r = await chamar('entrar', { email, senha: f.senha.value });
      S.token = r.token; guardar.por('token', r.token); guardar.por('email', email); guardar.por('verAgenda', '');
      await iniciarSessao();
    } catch (e) { telaEntrar(erroDe(e)); }
    finally { ocupado(false); }
  };
}

function telaCadastro(aviso) {
  // funções da escala e pastorais do calendário, sem repetir nomes
  const nomes = [];
  [].concat((S.info && S.info.funcoes) || [], (S.info && S.info.pastorais) || []).forEach(f => { if (!nomes.some(n => n.toLowerCase() === f.nome.toLowerCase())) nomes.push(f.nome); });
  const fs = nomes.map(nome => ({ nome }));
  $('#raiz').innerHTML = `<div class="cartao">
    <h2>Pedir acesso</h2>${msg(aviso)}
    <p class="pequeno sutil">Para a coordenação de uma pastoral ou serviço. A secretaria confere e libera o acesso.</p>
    <p style="margin:0 0 4px">O que você precisa?</p>

      <label class="chk"><input type="checkbox" name="aceite" required> Li o aviso acima e concordo.</label>

    if (!quer.length) return telaCadastroErro(f, 'Marque o que você precisa: calendário, escala ou os dois.');
    ocupado(true);
    try {
      const r = await chamar('cadastrar', { nome: f.nome.value, email: f.email.value, senha: f.senha.value, funcao: f.funcao.value, recado: f.recado.value, aceite: f.aceite.checked, quer });
      guardar.por('email', f.email.value.trim());
      telaEntrar(r.msg, true);
    } catch (e) { telaCadastroErro(f, erroDe(e)); }
    finally { ocupado(false); }

}
function telaCadastroErro(f, texto) {
  f.querySelector('.msg')?.remove();

}

async function iniciarSessao() {
  const r = await chamar('eu', { token: S.token });
  S.eu = r.eu; S.meses = r.meses || [];
  mostrarParoquia(r.paroquia);
  if (!S.funcao || !S.eu.funcoes.some(f => f.id === S.funcao)) S.funcao = (S.eu.funcoes[0] || {}).id || '';
  const hoje = new Date().toISOString().slice(0, 7);
  if (!S.mes || !S.meses.includes(S.mes)) S.mes = S.meses.find(m => m >= hoje) || S.meses[S.meses.length - 1] || '';
  if (S.eu.trocarSenha) return telaTrocarSenha(true);
  if (!S.agMes) S.agMes = hojeIso().slice(0, 7);
  await Promise.all([carregarEscala(), carregarAgenda()]);
  telaPrincipal();
}

// sem login: só ver a agenda (quem abre o link de novo cai direto nela até clicar em Entrar)
async function verAgendaAberta() {
  S.publico = true; S.token = ''; S.eu = { nome: '', funcoes: [], pastorais: [] }; S.secao = 'agenda'; S.agFiltro = '';
  if (!S.agMes) S.agMes = hojeIso().slice(0, 7);
  guardar.por('verAgenda', '1');
  ocupado(true);
  try { await carregarAgenda(); } finally { ocupado(false); }
  telaPrincipal();
}

async function carregarEscala() {
  S.escala = null; S.mudancas = {};
  if (!S.funcao || !S.mes) return;
  S.filtro = guardar.ler('filtro.' + S.funcao);
  try { S.escala = await chamar('escala', { token: S.token, mes: S.mes, funcao: S.funcao }); }
  catch (e) { if (e && e.sair) throw e; S.escala = { erro: erroDe(e) }; }
}

function telaPrincipal(aviso, ok) {

  let corpo;
  if (S.secao === 'agenda') corpo = htmlAgenda(aviso, ok);
  else if (S.secao === 'relatorio') corpo = htmlRelatorio(aviso, ok);
  else if (!S.meses.length) corpo = `<div class="cartao">${msg('A secretaria ainda não mandou as Missas de nenhum mês.')}</div>`;
  else corpo = `<div class="cartao">
      <div class="linha">
        ${fs.length > 1 ? `<label>Pastoral / função <select id="sFuncao">${fs.map(f => `<option value="${esc(f.id)}"${f.id === S.funcao ? ' selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>` : `<p style="margin:0 0 12px"><b>${esc(fs[0].nome)}</b></p>`}
        <label>Mês <select id="sMes">${S.meses.map(m => `<option value="${m}"${m === S.mes ? ' selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></label>
      </div>
      <div class="abas"><button type="button" data-aba="escala" class="${S.aba === 'escala' ? 'ativo' : ''}">📅 Escala</button><button type="button" data-aba="nomes" class="${S.aba === 'nomes' ? 'ativo' : ''}">🙋 Nomes</button></div>
      ${msg(aviso, ok)}
      <div id="conteudo">${S.aba === 'escala' ? htmlEscala() : htmlNomes()}</div>
    </div>`;
  $('#raiz').innerHTML = (S.publico
      ? capaParoquia() + `<div class="linha" style="margin-bottom:10px"><span class="sutil">👀 Só vendo o calendário</span><span class="espaco"></span>
        <button type="button" class="link" id="bEntrar">Coordenador? Entrar</button></div>`
      : `<div class="linha" style="margin-bottom:10px"><span>Olá, <b>${esc(eu.nome.split(' ')[0])}</b></span><span class="espaco"></span>
      <button type="button" class="link" id="bSenha">Trocar senha</button><button type="button" class="link" id="bSair">Sair</button></div>`)
    + (secoes.length > 1 ? `<div class="abas secoes">${secoes.map(([k, t]) => `<button type="button" data-secao="${k}" class="${S.secao === k ? 'ativo' : ''}">${t}</button>`).join('')}</div>` : '')
    + corpo;
  if (S.publico) $('#bEntrar').onclick = () => { guardar.por('verAgenda', ''); telaEntrar(); };
  else {
    $('#bSair').onclick = async () => { try { await chamar('sair', { token: S.token }); } catch (_) {} S.token = ''; guardar.por('token', ''); telaEntrar('Você saiu.', true); };
    $('#bSenha').onclick = () => telaTrocarSenha(false);
  }
  document.querySelectorAll('[data-secao]').forEach(b => b.onclick = () => {
    if (S.secao === 'escala' && b.dataset.secao !== 'escala' && Object.keys(S.mudancas).length && !confirm('Há mudanças na escala não salvas. Sair sem salvar?')) return;
    if (b.dataset.secao !== 'escala') S.mudancas = {};
    S.secao = b.dataset.secao; guardar.por('secao', S.secao); telaPrincipal();
  });
  if (S.secao === 'agenda') return ligarAgenda();
  if (S.secao === 'relatorio') return ligarRelatorio();
  const trocar = async () => {
    if (Object.keys(S.mudancas).length && !confirm('Há mudanças não salvas. Sair sem salvar?')) return telaPrincipal();
    ocupado(true);
    try { await carregarEscala(); telaPrincipal(); } catch (e) { telaEntrar(erroDe(e)); } finally { ocupado(false); }
  };
  if ($('#sFuncao')) $('#sFuncao').onchange = e => { S.funcao = e.target.value; trocar(); };
  if ($('#sMes')) $('#sMes').onchange = e => { S.mes = e.target.value; trocar(); };
  document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { S.aba = b.dataset.aba; telaPrincipal(); });
  ligarEscala();
}

const menores = f => f && (f.menores || /coroinha|acolit|acólit/i.test(f.nome || ''));
const explica = (txt, equipes) => String(txt || '').split(',').map(s => s.trim()).filter(Boolean)
  .map(n => { const e = equipes.find(q => q.nome.toLowerCase() === n.toLowerCase()); return e && e.membros ? `${e.nome} (${e.membros})` : n; }).join(', ');

// "só a minha Missa": cada coordenação costuma cuidar de um horário (dia da semana + hora + igreja)
const DIAS_LONGOS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const diaSem = iso => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d).getDay(); };
const vaga = l => `${diaSem(l.iso)}|${l.hora}|${l.texto}`;
function vagasDoMes(linhas) {
  const m = new Map();
  for (const l of linhas) if (!m.has(vaga(l))) m.set(vaga(l), { k: vaga(l), d: diaSem(l.iso), hora: l.hora, texto: l.texto });
  return [...m.values()].sort((a, b) => a.d - b.d || a.hora.localeCompare(b.hora) || a.texto.localeCompare(b.texto));
}

function htmlEscala() {
  const e = S.escala;
  if (!e) return '';
  if (e.erro) return msg(e.erro);
  const vagas = vagasDoMes(e.linhas);
  if (S.filtro && !vagas.some(v => v.k === S.filtro)) S.filtro = '';
  const filtro = `<label>Mostrar <select id="sFiltro"><option value="">Todas as Missas do mês (${e.linhas.length})</option>${vagas.map(v =>
    `<option value="${esc(v.k)}"${v.k === S.filtro ? ' selected' : ''}>Só ${DIAS_LONGOS[v.d]} ${esc(v.hora)} · ${esc(v.texto)}</option>`).join('')}</select></label>`;
  const linhas = e.linhas.map((l, i) => {
    if (S.filtro && vaga(l) !== S.filtro) return '';
    const vale = l.portal ? l.portal.valor : l.base, mudou = S.mudancas[l.chave] !== undefined;
    const estado = l.portal
      ? `<b>Mudado</b> por ${esc(l.portal.porNome)} em ${esc(quando(l.portal.em))} · esperando a secretaria${l.base ? ` · na escala: ${esc(explica(l.base, e.equipes))}` : ''}`
      : l.base ? `Na escala da secretaria: ${esc(explica(l.base, e.equipes))}` : 'Ninguém escalado ainda';
    return `<div class="missa${l.portal || mudou ? ' mudada' : ''}" data-i="${i}">
      <div class="quando">${dataCurta(l.iso)} · ${esc(l.hora)}</div><div class="onde">${esc(l.texto)}</div>
      <input data-chave="${esc(l.chave)}" list="dlNomes" value="${esc(mudou ? S.mudancas[l.chave] : vale)}" placeholder="Nomes ou equipe, separados por vírgula" maxlength="200">
      <div class="estado">${estado}</div></div>`;
  }).join('');
  const n = Object.keys(S.mudancas).length;
  return `<p class="pequeno sutil">Escreva os nomes (ou o nome da equipe) de cada Missa, separados por vírgula. <b>—</b> = ninguém.
      ${menores(e.funcao) ? '<br>👦 <b>Menores de idade:</b> só o primeiro nome e a inicial do sobrenome (ex.: Ana S.).' : ''}
      ${e.equipes.length ? `<br>Equipes: ${e.equipes.map(q => `<b>${esc(q.nome)}</b>${q.membros ? ` (${esc(q.membros)})` : ''}`).join('; ')}` : ''}</p>
    ${filtro}
    <datalist id="dlNomes">${e.equipes.map(q => `<option value="${esc(q.nome)}">`).join('')}${e.pessoas.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    ${linhas || '<p class="sutil">Nenhuma Missa neste mês.</p>'}
    <div class="rodape"><span class="pequeno sutil" id="nMud">${n ? `${n} mudança${n > 1 ? 's' : ''} sem salvar` : 'Tudo salvo'}</span><span class="espaco"></span>
      <button type="button" id="bDesfazer"${n ? '' : ' disabled'}>Desfazer</button><button type="button" class="primario" id="bSalvar"${n ? '' : ' disabled'}>Salvar</button></div>`;
}

function htmlNomes() {
  const e = S.escala;
  if (!e || e.erro) return msg(e && e.erro);
  const daSec = e.pessoas.filter(p => !e.extras.includes(p));
  return `<p class="pequeno sutil">Nomes que aparecem como sugestão ao escrever a escala. Os da secretaria vêm do cadastro dela;
      acrescente aqui quem ainda não está lá (um por linha).${menores(e.funcao) ? ' <b>Menores: só o primeiro nome e a inicial.</b>' : ''}</p>
    ${daSec.length ? `<p class="pequeno"><b>Da secretaria:</b> ${daSec.map(esc).join(', ')}</p>` : ''}
    <label>Nomes acrescentados por vocês <textarea id="tNomes">${esc(e.extras.join('\n'))}</textarea></label>
    <div class="linha"><span class="espaco"></span><button type="button" class="primario" id="bNomes">Salvar os nomes</button></div>`;
}

function ligarEscala() {
  if ($('#sFiltro')) $('#sFiltro').onchange = ev => { S.filtro = ev.target.value; guardar.por('filtro.' + S.funcao, S.filtro); telaPrincipal(); };
  document.querySelectorAll('.missa input').forEach(inp => {
    inp.oninput = () => {
      const l = S.escala.linhas.find(x => x.chave === inp.dataset.chave), vale = l.portal ? l.portal.valor : l.base, v = inp.value.trim();
      if (v === vale) delete S.mudancas[l.chave]; else S.mudancas[l.chave] = v;
      inp.closest('.missa').classList.toggle('mudada', !!l.portal || S.mudancas[l.chave] !== undefined);
      const n = Object.keys(S.mudancas).length;
      $('#nMud').textContent = n ? `${n} mudança${n > 1 ? 's' : ''} sem salvar` : 'Tudo salvo';
      $('#bSalvar').disabled = $('#bDesfazer').disabled = !n;
    };
  });
  if ($('#bDesfazer')) $('#bDesfazer').onclick = () => { S.mudancas = {}; telaPrincipal(); };
  if ($('#bSalvar')) $('#bSalvar').onclick = async () => {
    ocupado(true);
    try {
      const r = await chamar('salvar', { token: S.token, mes: S.mes, funcao: S.funcao, celas: S.mudancas });
      await carregarEscala(); telaPrincipal(r.msg, true);
    } catch (e) { if (e && e.sair) return telaEntrar(erroDe(e)); telaPrincipal(erroDe(e)); }
    finally { ocupado(false); }
  };
  if ($('#bNomes')) $('#bNomes').onclick = async () => {
    ocupado(true);
    try {
      const nomes = $('#tNomes').value.split('\n').map(s => s.trim()).filter(Boolean);
      const r = await chamar('salvarPessoas', { token: S.token, funcao: S.funcao, nomes });
      await carregarEscala(); telaPrincipal(r.msg, true);
    } catch (e) { if (e && e.sair) return telaEntrar(erroDe(e)); telaPrincipal(erroDe(e)); }
    finally { ocupado(false); }
  };
}

// ------------------------------------------------------------ 📅 agenda pastoral (0.2.0)
// Todos veem tudo; cada um põe eventos das pastorais dele em qualquer dia (⚠ quando cai junto com outra pastoral)
// e muda/apaga só os dessas pastorais. Quem a secretaria marcou muda qualquer um (e os da paróquia).
const CORES = ['#d4a93a', '#4f95ec', '#57b36f', '#e0473a', '#a46be0', '#e08a2e', '#2bb3b3', '#d45b9a', '#8a9a3a', '#6b7fd4', '#c27a4a', '#3aa37a'];
const corPastoral = pid => { const i = ((S.ag && S.ag.pastorais) || []).findIndex(p => p.id === pid); return CORES[(i < 0 ? 0 : i) % CORES.length]; };
const nomePastoral = pid => (((S.ag && S.ag.pastorais) || []).find(p => p.id === pid) || {}).nome || pid;
const isoDe = (a, m, d) => `${a}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const somaDia = (iso, n) => { const [a, m, d] = iso.split('-').map(Number), dt = new Date(a, m - 1, d + n); return isoDe(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); };
const hojeIso = () => { const d = new Date(); return isoDe(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const podePor = () => ((S.eu && S.eu.pastorais) || []).length > 0;
// (0.3.0) ⏳ provisório (espera a secretaria; só quem entra vê) · 🔁 pediu para mudar dia/hora/local ou tirar · ✖ não aprovado
const marcaEv = e => e.situacao === 'provisorio' ? '⏳ ' : e.situacao === 'recusado' ? '✖ ' : e.pedido ? '🔁 ' : '';
const classeEv = e => e.situacao === 'provisorio' ? ' prov' : e.situacao === 'recusado' ? ' recus' : '';
const titEv = e => marcaEv(e) + (e.origem === 'sec' ? '🎉 ' : '') + e.titulo;
const esperando = e => e.situacao === 'provisorio' || !!e.pedido;
const periodo = e => e.fim ? `${dataCurta(e.ini)} a ${dataCurta(e.fim)}` : dataCurta(e.ini);

async function carregarAgenda(ano) {
  ano = ano || (S.agMes || hojeIso()).slice(0, 4);
  try { S.ag = await chamar('agenda', { token: S.token, ano }); }
  catch (e) { if (e && e.sair) throw e; S.ag = { erro: erroDe(e), ano }; }
}
function eventosDoDia(iso, todos) {
  return ((S.ag && S.ag.eventos) || []).filter(e => e.ini <= iso && (e.fim || e.ini) >= iso
      && (todos ? e.situacao !== 'recusado' : !S.agFiltro || (S.agFiltro === '_meus' ? e.meu : S.agFiltro === '_espera' ? esperando(e) : e.pastoral === S.agFiltro)))
    .sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99') || a.titulo.localeCompare(b.titulo, 'pt-BR'));
}
const conflito = iso => new Set(eventosDoDia(iso, true).map(e => e.pastoral)).size > 1;
const marcaConflito = iso => conflito(iso) ? ' <span class="ag-conf" title="Mais de uma pastoral neste dia">⚠</span>' : '';

function htmlAgenda(aviso, ok) {
  const ag = S.ag;
  if (!ag) return `<div class="cartao">${msg('Carregando a agenda…')}</div>`;
  if (ag.erro) return `<div class="cartao">${msg(ag.erro)}<button type="button" id="agTentar">Tentar de novo</button></div>`;
  const [a, m] = S.agMes.split('-').map(Number);
  const filtro = `<select id="agFiltro" class="campo" aria-label="Mostrar"><option value="">Todas as pastorais</option>`
    + (podePor() ? `<option value="_meus"${S.agFiltro === '_meus' ? ' selected' : ''}>Só o que eu posso mudar</option>` : '')
    + (S.publico ? '' : `<option value="_espera"${S.agFiltro === '_espera' ? ' selected' : ''}>⏳ Esperando a secretaria</option>`)
    + ag.pastorais.map(p => `<option value="${esc(p.id)}"${p.id === S.agFiltro ? ' selected' : ''}>${esc(p.nome)}</option>`).join('') + '</select>';
  const usadas = new Set((ag.eventos || []).map(e => e.pastoral));
  return `<div class="cartao">${msg(aviso, ok)}
    <div class="ag-cab"><button type="button" id="agAnt" aria-label="Mês anterior">◀</button><b class="ag-mes">${MESES[m - 1]} de ${a}</b>
      <button type="button" id="agProx" aria-label="Próximo mês">▶</button><button type="button" id="agHoje" class="pequeno">Hoje</button><span class="espaco"></span>
      <div class="abas"><button type="button" data-vista="cal" class="${S.agVista === 'cal' ? 'ativo' : ''}" title="Calendário">🗓</button><button type="button" data-vista="lista" class="${S.agVista === 'lista' ? 'ativo' : ''}" title="Lista">☰</button></div></div>
    <div class="linha">${filtro}<span class="espaco"></span>${podePor() ? '<button type="button" class="primario" id="agNovo">＋ Novo evento</button>' : ''}</div>
    ${S.agVista === 'cal' ? htmlCalendario(a, m) : htmlListaMes(a, m)}
    <p class="pequeno sutil">${podePor() ? `Toque num dia para pôr um evento. Você muda os eventos de: <b>${S.eu.pastorais.map(p => esc(p.nome)).join(', ')}</b>.`
      : S.publico ? 'Coordena uma pastoral? Clique em <b>Entrar</b> para pôr os eventos dela.' : 'Para pôr eventos, peça à secretaria para ligar a sua pastoral.'} ⚠ = mais de uma pastoral no mesmo dia (pode, mas vale combinar).
      ${S.publico ? '' : '<br>⏳ = provisório: espera a aprovação da secretaria e só os coordenadores veem. 🔁 = pediram para mudar o dia, a hora ou o local (ou tirar); até a secretaria aprovar, vale o que está aqui.'}</p>
    <div class="ag-legenda">${ag.pastorais.filter(p => usadas.has(p.id)).map(p => `<span><i style="background:${corPastoral(p.id)}"></i>${esc(p.nome)}</span>`).join('')}</div>
    <p class="pequeno sutil" style="margin:12px 0 0">📱 Para abrir mais rápido: no celular, no menu do navegador (⋮ ou ⬆ Compartilhar), toque em <b>Adicionar à tela inicial</b>.</p></div>`;
}

function htmlCalendario(a, m) {
  const hoje = hojeIso(), ini = somaDia(isoDe(a, m, 1), -new Date(a, m - 1, 1).getDay());
  let h = `<div class="ag-grade">${DIAS.map(d => `<div class="ag-dsem">${d}</div>`).join('')}`;
  for (let i = 0; i < 42; i++) {
    const iso = somaDia(ini, i), fora = +iso.slice(5, 7) !== m;
    if (i === 35 && fora) break;
    const evs = fora ? [] : eventosDoDia(iso);
    h += `<div class="ag-dia${fora ? ' fora' : podePor() ? ' pode' : ''}${iso === hoje ? ' hoje' : ''}"${fora ? '' : ` data-dia="${iso}"`}>
      <div class="ag-num">${+iso.slice(8)}${fora ? '' : marcaConflito(iso)}</div>
      ${evs.slice(0, 4).map(e => `<button type="button" class="ag-ev${classeEv(e)}" data-ev="${esc(e.id)}" style="--c:${corPastoral(e.pastoral)}" title="${esc(nomePastoral(e.pastoral))}: ${esc(e.titulo)}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(titEv(e))}</button>`).join('')}
      ${evs.length > 4 ? `<button type="button" class="ag-mais" data-lista="1">+${evs.length - 4}</button>` : ''}</div>`;
  }
  return h + '</div>';
}

function htmlListaMes(a, m) {
  let h = '';
  for (let d = 1, n = new Date(a, m, 0).getDate(); d <= n; d++) {
    // evento de vários dias: só no primeiro dia (ou no dia 1, se começou no mês anterior), com o período
    const iso = isoDe(a, m, d), evs = eventosDoDia(iso).filter(e => e.ini === iso || d === 1);
    if (!evs.length) continue;
    h += `<div class="ag-ldia${iso === hojeIso() ? ' hoje' : ''}"><div class="ag-ldata">${dataCurta(iso)}${marcaConflito(iso)}
        ${podePor() ? ` <button type="button" class="link pequeno" data-novo-dia="${iso}" title="Pôr um evento neste dia">＋</button>` : ''}</div>
      ${evs.map(e => `<button type="button" class="ag-lev${classeEv(e)}" data-ev="${esc(e.id)}" style="--c:${corPastoral(e.pastoral)}"><b>${e.hora ? esc(e.hora) + ' · ' : ''}${esc(titEv(e))}</b>
        <span class="sutil pequeno">${esc(nomePastoral(e.pastoral))}${e.fim ? ' · ' + periodo(e) : ''}${e.local ? ' · ' + esc(e.local) : ''}</span></button>`).join('')}</div>`;
  }
  return h || `<p class="sutil">Nada marcado neste mês${S.agFiltro ? ' com este filtro' : ''}.</p>`;
}

function ligarAgenda() {
  const ir = async n => {
    const [a, m] = S.agMes.split('-').map(Number), d = new Date(a, m - 1 + n, 1);
    S.agMes = n ? isoDe(d.getFullYear(), d.getMonth() + 1, 1).slice(0, 7) : hojeIso().slice(0, 7);
    if (S.agMes.slice(0, 4) !== S.ag.ano) { ocupado(true); try { await carregarAgenda(); } catch (e) { return telaEntrar(erroDe(e)); } finally { ocupado(false); } }
    telaPrincipal();
  };
  if ($('#agTentar')) return $('#agTentar').onclick = async () => { ocupado(true); try { await carregarAgenda(); telaPrincipal(); } catch (e) { telaEntrar(erroDe(e)); } finally { ocupado(false); } };
  $('#agAnt').onclick = () => ir(-1);
  $('#agProx').onclick = () => ir(1);
  $('#agHoje').onclick = () => ir(0);
  $('#agFiltro').onchange = ev => { S.agFiltro = ev.target.value; telaPrincipal(); };
  document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { S.agVista = b.dataset.vista; guardar.por('agVista', S.agVista); telaPrincipal(); });
  if ($('#agNovo')) $('#agNovo').onclick = () => telaEvento(null, S.agMes === hojeIso().slice(0, 7) ? hojeIso() : S.agMes + '-01');
  const raiz = $('#raiz');
  raiz.onclick = ev => {
    if (S.secao !== 'agenda') return;
    const be = ev.target.closest('[data-ev]');
    if (be) return telaDetalhe(S.ag.eventos.find(e => e.id === be.dataset.ev));
    if (ev.target.closest('[data-lista]')) { S.agVista = 'lista'; return telaPrincipal(); }
    const nd = ev.target.closest('[data-novo-dia]');
    if (nd) return telaEvento(null, nd.dataset.novoDia);
    const dia = ev.target.closest('.ag-dia[data-dia]');
    if (dia && podePor()) telaEvento(null, dia.dataset.dia);
  };
}

// o que já está marcado no mesmo dia (de outras pastorais), para quem está pondo um evento
function avisoDoDia(ini, fim, pastoral, id) {
  const outros = [];
  for (let d = ini; d && d <= (fim || ini) && outros.length < 8; d = somaDia(d, 1))
    eventosDoDia(d, true).forEach(e => { if (e.id !== id && e.pastoral !== pastoral && !outros.includes(e)) outros.push(e); });
  return outros.length ? `⚠ Já marcado ${fim && fim > ini ? 'nesses dias' : 'neste dia'}: ${outros.map(e => `<b>${esc(e.titulo)}</b> (${esc(nomePastoral(e.pastoral))})`).join('; ')}. Pode pôr assim mesmo.` : '';
}

// ------------------------------------------------------------ 📝 relatório das atividades do mês (por pastoral)
const relPast = () => (S.eu && S.eu.relatorio) || [];      // (0.3.0) só as pastorais marcadas para a pessoa
function mesPadraoRel() {   // até o dia 15, o relatório é do mês que passou
  const d = new Date(); if (d.getDate() <= 15) d.setMonth(d.getMonth() - 1);
  return isoDe(d.getFullYear(), d.getMonth() + 1, 1).slice(0, 7);
}
function mesesRel() {      // de 12 meses atrás até o mês que vem
  const out = [], d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1);
  for (let i = 0; i < 14; i++) { out.push(isoDe(d.getFullYear(), d.getMonth() + 1, 1).slice(0, 7)); d.setMonth(d.getMonth() - 1); }
  return out;
}
function htmlRelatorio(aviso, ok) {
  const ps = relPast();
  if (!S.relMes) S.relMes = mesPadraoRel();
  if (!S.relPast || !ps.some(p => p.id === S.relPast)) S.relPast = ps[0].id;
  const r = S.rel && S.rel.mes === S.relMes ? (S.rel.relatorios || []).find(x => x.pastoral === S.relPast) || {} : null;
  return `<div class="cartao"><h2>📝 Relatório do mês</h2>${msg(aviso, ok)}
    <p class="pequeno sutil">O resumo do que a pastoral fez no mês, para a secretaria juntar no relatório de atividades das pastorais. Pode voltar e completar depois.</p>
    <div class="linha">
      <label>Mês <select id="relMes">${mesesRel().map(m => `<option value="${m}"${m === S.relMes ? ' selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></label>
      ${ps.length > 1 ? `<label>Pastoral <select id="relPast">${ps.map(p => `<option value="${esc(p.id)}"${p.id === S.relPast ? ' selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>`
        : `<p style="margin:0 0 12px"><b>${esc(ps[0].nome)}</b></p>`}
    </div>
    ${!r ? msg('Carregando…') : `<form id="fRel">
      <label>O que a pastoral fez em ${nomeMes(S.relMes)}
        <textarea name="texto" maxlength="5000" style="min-height:12em" placeholder="Ex.: 4 encontros de formação (sábados, 15h); visita a 12 famílias; retiro no dia 18 com 35 pessoas; dificuldades; o que vem no próximo mês…">${esc(r.texto || '')}</textarea></label>
      <label style="max-width:260px">Pessoas atendidas ou participantes (opcional) <input name="participantes" inputmode="numeric" maxlength="6" value="${esc(r.participantes || '')}"></label>
      <div class="linha"><button class="primario">Salvar o relatório</button></div>
      ${r.em ? `<p class="rel-hist">Salvo por ${esc(r.porNome || '—')} em ${esc(quando(r.em))}.</p>` : ''}
    </form>`}</div>`;
}
function ligarRelatorio() {
  const recarregar = async () => {
    ocupado(true);
    try { S.rel = await chamar('relatorio', { token: S.token, mes: S.relMes }); telaPrincipal(); }
    catch (e) { if (e && e.sair) return telaEntrar(erroDe(e)); S.rel = { mes: S.relMes, relatorios: [] }; telaPrincipal(erroDe(e)); }
    finally { ocupado(false); }
  };
  $('#relMes').onchange = e => { S.relMes = e.target.value; recarregar(); };
  if ($('#relPast')) $('#relPast').onchange = e => { S.relPast = e.target.value; telaPrincipal(); };
  if (!S.rel || S.rel.mes !== S.relMes) return recarregar();
  $('#fRel').onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    ocupado(true);
    try {
      const r = await chamar('relatorioSalvar', { token: S.token, mes: S.relMes, pastoral: S.relPast, texto: f.texto.value, participantes: f.participantes.value });
      S.rel = await chamar('relatorio', { token: S.token, mes: S.relMes });
      telaPrincipal(r.msg, true);
    } catch (e) {
      if (e && e.sair) return telaEntrar(erroDe(e));
      // não perde o que foi escrito
      const rs = S.rel.relatorios || (S.rel.relatorios = []), x = rs.find(q => q.pastoral === S.relPast) || (rs.push({ pastoral: S.relPast }), rs[rs.length - 1]);
      x.texto = f.texto.value; x.participantes = f.participantes.value;
      telaPrincipal(erroDe(e));
    }
    finally { ocupado(false); }
  };
}

// ------------------------------------------------------------ 📲 pôr o evento na agenda do celular
const icsTxt = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsData = (iso, h) => iso.replace(/-/g, '') + (h ? 'T' + h.replace(':', '') + '00' : '');
function horasDepois(iso, h, n) { const [a, m, d] = iso.split('-').map(Number), [hh, mm] = h.split(':').map(Number), t = new Date(a, m - 1, d, hh + n, mm);
  return { iso: isoDe(t.getFullYear(), t.getMonth() + 1, t.getDate()), hora: String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') }; }
// um dia com hora: das "hora" até 2 horas depois; vários dias (ou sem hora): dias inteiros, com a hora escrita nos detalhes
function datasDoEvento(ev) {
  if (ev.hora && !ev.fim) { const f = horasDepois(ev.ini, ev.hora, 2); return { ini: icsData(ev.ini, ev.hora), fim: icsData(f.iso, f.hora), dia: false }; }
  return { ini: icsData(ev.ini), fim: icsData(somaDia(ev.fim || ev.ini, 1)), dia: true };
}
const paroquiaNome = () => (S.info && S.info.paroquia) || '';
function descDoEvento(ev) {
  return [ev.fim && ev.hora ? `Às ${ev.hora}.` : '', ev.desc, nomePastoral(ev.pastoral) + (paroquiaNome() ? ' · ' + paroquiaNome() : '')].filter(Boolean).join('\n\n');
}
function baixarIcs(ev) {
  const d = datasDoEvento(ev);
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MiguelAngelus//Portal das pastorais//PT', 'BEGIN:VEVENT',
    'UID:' + ev.id + '@portal-miguelangelus', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'SUMMARY:' + icsTxt(ev.titulo), (d.dia ? 'DTSTART;VALUE=DATE:' : 'DTSTART:') + d.ini, (d.dia ? 'DTEND;VALUE=DATE:' : 'DTEND:') + d.fim,
    ev.local ? 'LOCATION:' + icsTxt(ev.local) : '', 'DESCRIPTION:' + icsTxt(descDoEvento(ev)), 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(txt);
  a.download = (ev.titulo.replace(/[^\wÀ-ÿ -]+/g, '').trim().slice(0, 60) || 'evento') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
function linkGoogleAgenda(ev) {
  const d = datasDoEvento(ev);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.titulo) + '&dates=' + d.ini + '/' + d.fim
    + '&details=' + encodeURIComponent(descDoEvento(ev)) + (ev.local ? '&location=' + encodeURIComponent(ev.local) : '');
}

// (0.3.0) o que espera a secretaria (ou o que ela não aprovou), para quem entra
function htmlSituacao(ev) {
  if (S.publico) return '';
  const mot = r => r && r.motivo ? `: “${esc(r.motivo)}”` : '';
  const p = ev.pedido, r = ev.recusa;
  let h = '';
  if (ev.situacao === 'provisorio') h = '⏳ <b>Provisório</b>: espera a aprovação da secretaria. Por enquanto só os coordenadores veem.';
  else if (ev.situacao === 'recusado') h = `✖ <b>A secretaria não aprovou este evento</b>${mot(r)}. Só a sua pastoral vê. Mude e salve para pedir de novo, ou apague.`;
  else if (p && p.cancelar) h = `🔁 <b>${esc(p.porNome || 'A pastoral')} pediu para tirar este evento.</b> Até a secretaria aprovar, ele continua no calendário.`;
  else if (p) h = `🔁 <b>Mudança pedida</b> por ${esc(p.porNome || '—')}: 📅 ${periodo(p)}${p.hora ? ' · 🕒 ' + esc(p.hora) : ''}${p.local ? ' · 📍 ' + esc(p.local) : ''}.<br>Até a secretaria aprovar, vale o que está acima.`;
  else if (ev.ajuste && ev.meu) { const a = ev.ajuste.de || {};
    h = `✅ <b>A secretaria aprovou com um ajuste.</b> Pedido: ${periodo(a)}${a.hora ? ' às ' + esc(a.hora) : ''}${a.local ? ', ' + esc(a.local) : ''}. Ficou como está acima.`; }
  else if (r && ev.meu) h =`A secretaria não aprovou ${r.cancelar ? 'o pedido para tirar o evento' : `a mudança para ${periodo(r)}${r.hora ? ' às ' + esc(r.hora) : ''}${r.local ? ', ' + esc(r.local) : ''}`}${mot(r)}.`;
  return h ? `<p class="ag-situ">${h}</p>` : '';
}

// detalhes do evento: todos veem; quem pode mudar vê o ✏
function telaDetalhe(ev) {
  if (!ev) return telaPrincipal();
  $('#raiz').onclick = null;
  const quemMuda = ev.origem === 'sec' ? 'Marcado na secretaria. Só ela muda este evento.'
    : ev.pastoral === 'paroquia' ? 'Só a secretaria muda este evento.' : `Só a ${esc(nomePastoral(ev.pastoral))} ou a secretaria mudam este evento.`;
  $('#raiz').innerHTML = `<div class="cartao ag-det"><h2>${esc(ev.titulo)}</h2>
    <p><span class="ag-legenda"><span><i style="background:${corPastoral(ev.pastoral)}"></i>${esc(nomePastoral(ev.pastoral))}${ev.origem === 'sec' ? ' · 🎉 evento da paróquia' : ''}</span></span></p>
    <p>📅 ${periodo(ev)}${ev.hora ? ' · 🕒 ' + esc(ev.hora) : ''}${ev.local ? '<br>📍 ' + esc(ev.local) : ''}</p>
    ${htmlSituacao(ev)}
    ${ev.desc ?`<p style="white-space:pre-wrap">${esc(ev.desc)}</p>` : ''}
    <div class="linha" style="margin:12px 0">
      <button type="button" id="agIcs" class="primario" title="Baixa o evento: no celular, abra o arquivo e ele vai para a agenda">📲 Pôr na agenda do celular</button>
      <a class="botao" id="agGoogle" href="${esc(linkGoogleAgenda(ev))}" target="_blank" rel="noopener">Google Agenda ↗</a>
    </div>
    ${S.publico ? '' : `<p class="pequeno sutil">${ev.origem === 'sec' ? '' : `Posto por ${esc(ev.autorNome || '—')}${ev.porNome && ev.em ? ` · última mudança: ${esc(ev.porNome)}, ${esc(quando(ev.em))}` : ''}.<br>`}
      ${ev.meu ? '' : quemMuda}</p>`}
    <div class="linha"><button type="button" id="agVoltar">◀ Voltar</button><span class="espaco"></span>
      ${ev.meu ? '<button type="button" id="agMudar">✏ Mudar ou apagar</button>' : ''}</div></div>`;
  $('#agVoltar').onclick = () => telaPrincipal();
  $('#agIcs').onclick = () => baixarIcs(ev);
  if ($('#agMudar')) $('#agMudar').onclick = () => telaEvento(ev);
}

function telaEvento(ev, dia, aviso) {
  const novo = !ev;
  $('#raiz').onclick = null;
  if (!novo && !ev.meu) return telaDetalhe(ev);
  const e0 = ev || { titulo: '', ini: dia, fim: '', hora: '', local: '', pastoral: (S.eu.pastorais.find(p => p.id === S.agFiltro) || S.eu.pastorais.find(p => p.id !== 'paroquia') || S.eu.pastorais[0]).id, desc: '' };
  // (0.3.0) num aprovado com mudança pedida, o formulário mostra o que foi pedido (para ajustar o pedido)
  const e = e0.pedido && !e0.pedido.cancelar ? Object.assign({}, e0, { ini: e0.pedido.ini, fim: e0.pedido.fim || '', hora: e0.pedido.hora || '', local: e0.pedido.local || '' }) : e0;
  const admin = !!(S.eu && S.eu.admin), aprovadoJa = !novo && !ev.situacao;
  const regra = admin ? '' : novo ? 'O evento fica ⏳ provisório (só os coordenadores veem) até a secretaria aprovar.'
    : aprovadoJa ? 'Nome, pastoral e detalhes mudam na hora. <b>Dia, hora e local</b> vão para a aprovação da secretaria; até lá, vale o que está aprovado.'
    : 'Continua ⏳ provisório até a secretaria aprovar.';
  $('#raiz').innerHTML = `<div class="cartao"><h2>${novo ? '＋ Novo evento' : '✏ Mudar evento'}</h2>${msg(aviso)}
    ${novo ? '' : htmlSituacao(ev)}${regra ? `<p class="pequeno sutil">${regra}</p>` : ''}
    <form id="fEv">
      <label>Nome do evento <input name="titulo" required maxlength="120" value="${esc(e.titulo)}" placeholder="Ex.: Retiro dos crismandos"></label>
      <label>Pastoral <select name="pastoral">${S.eu.pastorais.map(p => `<option value="${esc(p.id)}"${p.id === e.pastoral ? ' selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
      <div class="linha">
        <label>Dia <input name="ini" type="date" required value="${esc(e.ini)}"></label>
        <label>Até (se for mais de um dia) <input name="fim" type="date" value="${esc(e.fim)}"></label>
        <label>Hora (opcional) <input name="hora" type="time" value="${esc(e.hora)}"></label>
      </div>
      <label>Local (opcional) <input name="local" maxlength="120" value="${esc(e.local)}" placeholder="Ex.: Salão paroquial, Capela NSF"></label>
      <label>Detalhes (opcional) <textarea name="desc" maxlength="1000" style="min-height:5em">${esc(e.desc)}</textarea></label>
      <p class="ag-aviso" id="agAviso"></p>
      ${novo ? '' : `<p class="pequeno sutil">Posto por ${esc(ev.autorNome || '—')}${ev.porNome && ev.em ? ` · última mudança: ${esc(ev.porNome)}, ${esc(quando(ev.em))}` : ''}.</p>`}
      <div class="linha"><button class="primario">Salvar</button><button type="button" id="agCancelar">Cancelar</button><span class="espaco"></span>
        ${novo ? '' : `<button type="button" id="agApagar">${aprovadoJa && !admin ? '🗑 Pedir para tirar' : '🗑 Apagar'}</button>`}</div>
    </form></div>`;
  const f = $('#fEv');
  const conferir = () => { $('#agAviso').innerHTML = avisoDoDia(f.ini.value, f.fim.value, f.pastoral.value, e.id); };
  ['ini', 'fim', 'pastoral'].forEach(k => f[k].addEventListener('change', conferir));
  conferir();
  $('#agCancelar').onclick = () => telaPrincipal();
  const depois = async r => {
    if (f.ini.value) S.agMes = f.ini.value.slice(0, 7);          // volta ao mês do evento
    await carregarAgenda(); telaPrincipal(r.msg, true);
  };
  if ($('#agApagar')) $('#agApagar').onclick = async () => {
    if (!confirm(aprovadoJa && !admin ? `Pedir à secretaria para tirar "${e.titulo}" do calendário?` : `Apagar "${e.titulo}"?`)) return;
    ocupado(true);
    try { await depois(await chamar('agendaExcluir', { token: S.token, id: e.id })); }
    catch (x) { if (x && x.sair) return telaEntrar(erroDe(x)); telaEvento(ev, dia, erroDe(x)); }
    finally { ocupado(false); }
  };
  f.onsubmit = async evt => {
    evt.preventDefault();
    const dados = { id: e.id || '', titulo: f.titulo.value, pastoral: f.pastoral.value, ini: f.ini.value, fim: f.fim.value, hora: f.hora.value, local: f.local.value, desc: f.desc.value };
    ocupado(true);
    try { await depois(await chamar('agendaSalvar', { token: S.token, evento: dados })); }
    catch (x) { if (x && x.sair) return telaEntrar(erroDe(x)); telaEvento(ev ? Object.assign({}, ev, dados, { pedido: null }) : null, dados.ini, erroDe(x)); if (!ev) { const g = $('#fEv'); Object.keys(dados).forEach(k => { if (g[k]) g[k].value = dados[k]; }); } }
    finally { ocupado(false); }
  };
}

window.addEventListener('beforeunload', ev => { if (Object.keys(S.mudancas).length) { ev.preventDefault(); ev.returnValue = ''; } });
